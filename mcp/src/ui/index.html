<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SayShape</title>
    <style>
      /*FONTS*/
      html, body { margin: 0; padding: 0; background: transparent; }
      /* Hosts such as VS Code cap tall MCP App iframes. Allow the document to
         scroll inside that cap so wheel gestures over the canvas are not lost.
         At scroll boundaries VS Code forwards the wheel to the chat pane.
         A hidden body overflow leaves scrollHeight > clientHeight but prevents
         the document from moving, trapping the wheel in the iframe. */
      body { overflow-x: hidden; overflow-y: auto; }
      #wrap { width: 100%; }
      canvas { display: block; }
      /* The view's own tools: a slim strip with its controls at the right, above the interface. */
      /* Its right edge lines up with the interface's: the toolbar's own 6px padding plus 14 makes the engine's 20. */
      #bar { display: flex; justify-content: flex-end; padding-right: 14px; }
      #bar[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="bar" hidden><canvas id="view-tools" aria-label="Interface tools: theme and save image"></canvas></div>
      <canvas id="sayshape" aria-label="An interface drawn by SayShape"></canvas>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
