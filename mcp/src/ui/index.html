<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SayShape</title>
    <style>
      /*FONTS*/
      html, body { margin: 0; padding: 0; background: transparent; }
      /* Hosts such as VS Code cap tall MCP App iframes. Allow the document to
         scroll inside that cap so wheel gestures over the canvas are not lost.
         At scroll boundaries VS Code forwards the wheel to the chat pane.
         A hidden body overflow leaves scrollHeight > clientHeight but prevents
         the document from moving, trapping the wheel in the iframe. */
      body { overflow-x: hidden; overflow-y: auto; }
      #wrap { width: 100%; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="theme-picker" aria-label="SayShape theme selection"></canvas>
      <canvas id="loom" aria-label="An interface drawn by SayShape"></canvas>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
