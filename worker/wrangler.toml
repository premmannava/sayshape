# The SayShape model proxy (a Cloudflare Worker). See README.md in this folder.
name = "sayshape-model"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# The model's id as the provider names it (its "model" in the provider's API example),
# and the name the page shows next to live answers. Answers stay off while MODEL is empty.
MODEL = "deepseek-flash"
MODEL_LABEL = "DeepSeek V4.1 Flash"
# The provider's OpenAI-compatible base URL.
MODEL_URL = "https://api.deepseek.com"
ALLOWED_ORIGINS = "https://premmannava.github.io"
GENERATION_ENABLED = "true"
# "false" stops showing the model's thinking on the chat page. Thinking is free text, so while
# it's shown the key can be used to get prose back (up to 12,000 characters an answer).
SHOW_THINKING = "true"
# "true": a new chat question is first asked with the small report guide (the report preset), and with the chat guide only when
# a report can't show it. The chat page draws with presets on. Set to "false" to go back to the chat guide alone.
REPORT_FIRST = "true"
# How hard the model thinks before it writes: DeepSeek takes "none", "low", "high" or "max" and
# uses "high" when this is empty, which is most of the wait for an answer. "none" is fastest and
# shows no thinking.
REASONING_EFFORT = "low"
# Questions answered per day for the whole site. Needs the ANSWER_COUNT namespace below.
DAILY_ANSWERS = "500"
# Set to "false" if the model refuses stream_options; the page then shows no token counts.
STREAM_USAGE = "true"

# Per-visitor limit, by IP: 4 questions a minute.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 4
  period = 60

# The daily count. Create it once with
#   npx wrangler kv namespace create ANSWER_COUNT
# and put the id it prints below. Without it there's no daily cap.
[[kv_namespaces]]
binding = "ANSWER_COUNT"
id = "89cc3751902a421e8ecacfb9cc3f400a"

# Secrets, set with wrangler and never written here:
#   npx wrangler secret put MODEL_API_KEY        the provider's API key
#   npx wrangler secret put TURNSTILE_SECRET     (recommended)

# Saved answers, for visitors who turn on "Help improve SayShape" on the chat page
# (src/records.ts). Off until this block is filled in: without it nothing is saved and the
# page offers no switch. Set it up once with
#   npx wrangler d1 create sayshape-records
#   (put the database_id it prints below; the binding must stay RECORDS, which the code reads)
#   npx wrangler d1 migrations apply sayshape-records --remote
# Comment the block out and deploy to stop saving.
[[d1_databases]]
binding = "RECORDS"
database_name = "sayshape-records"
database_id = "6b460ab1-2a11-4e51-b008-84d2a4d3607c"

# Daily at 03:17 UTC: delete saved answers older than 30 days (RETENTION_DAYS).
# Does nothing while RECORDS isn't set up.
[triggers]
crons = ["17 3 * * *"]
