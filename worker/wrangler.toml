# The SayShape model proxy (a Cloudflare Worker). See README.md in this folder.
name = "sayshape-model"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# The model's id as the provider names it (its "model" in the provider's API example),
# and the name the page shows next to live answers. Answers stay off while MODEL is empty.
MODEL = "deepseek-flash"
MODEL_LABEL = "DeepSeek V4.1 Flash"
# The provider's OpenAI-compatible base URL.
MODEL_URL = "https://api.deepseek.com"
ALLOWED_ORIGINS = "https://premmannava.github.io"
GENERATION_ENABLED = "true"
# "false" stops showing the model's thinking on the chat page. Thinking is free text, so while
# it's shown the key can be used to get prose back (up to 12,000 characters an answer).
SHOW_THINKING = "true"
# Questions answered per day for the whole site. Needs the ANSWER_COUNT namespace below.
DAILY_ANSWERS = "500"
# Set to "false" if the model refuses stream_options; the page then shows no token counts.
STREAM_USAGE = "true"

# Per-visitor limit, by IP: 4 questions a minute.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 4
  period = 60

# The daily count. Create it once with
#   npx wrangler kv namespace create ANSWER_COUNT
# and put the id it prints below. Without it there's no daily cap.
[[kv_namespaces]]
binding = "ANSWER_COUNT"
id = "89cc3751902a421e8ecacfb9cc3f400a"

# Secrets, set with wrangler and never written here:
#   npx wrangler secret put MODEL_API_KEY        the provider's API key
#   npx wrangler secret put TURNSTILE_SECRET     (recommended)
